<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f7a63'/%3E%3Cpath d='M8 22V10l8 6 8-6v12' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // The same rule as readTheme in src/lib/theme.ts, run before the first paint.
      (function () {
        var t = "holo";
        try {
          t = localStorage.getItem("atlas:theme") || "holo";
        } catch (e) {}
        if (t !== "auto") document.documentElement.setAttribute("data-theme", t === "light" || t === "dark" ? t : "holo");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Archivo:wght@600;800&family=Chakra+Petch:wght@500;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
